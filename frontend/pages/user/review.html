<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Product | IDPShop</title>
    
    <link rel="icon" type="image/png" href="../../public/idp_browser_tab_logo.png">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../../css/global.css">
    <style>
        .review-container {
            max-width: 500px;
            margin: 4rem auto;
            padding: 2.5rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #f1f5f9;
        }
        .product-preview {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 2rem;
        }
        .product-preview img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #0f172a; }
        p { color: #64748b; margin-bottom: 2rem; }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #1e293b; }
        
        select, textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.2s;
        }
        select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        textarea { height: 150px; resize: none; }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .submit-btn:hover { background: #1d4ed8; transform: translateY(-2px); }
        .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { color: #1e293b; }
    </style>
</head>
<body style="background: #f8fafc;">

    <div class="review-container">
        <div style="text-align: center; margin-bottom: 2rem;">
            <img src="../../public/idp_shop_logo.png" alt="Logo" style="height: 40px;">
        </div>

        <h1>⭐ Rate Your Purchase</h1>
        <p>Your feedback helps other shoppers make better choices.</p>

        <div class="form-group">
            <label>Rating</label>
            <select id="rating">
                <option value="5">⭐⭐⭐⭐⭐ (Excellent)</option>
                <option value="4">⭐⭐⭐⭐☆ (Good)</option>
                <option value="3">⭐⭐⭐☆☆ (Average)</option>
                <option value="2">⭐⭐☆☆☆ (Poor)</option>
                <option value="1">⭐☆☆☆☆ (Very Bad)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Your Review</label>
            <textarea id="comment" placeholder="What did you like or dislike about the product?"></textarea>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="submitReview()">
            Submit My Review
        </button>

        <a href="dashboard.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/review.js"></script>
</body>
</html>
