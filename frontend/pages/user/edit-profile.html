<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | IDPShop</title>

    <link rel="icon" type="image/png" href="../../public/idp_browser_tab_logo.png">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/global.css">
    <style>
        .edit-container {
            max-width: 600px;
            margin: 3rem auto;
            padding: 0 1rem;
        }
        .edit-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #1e293b;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .form-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .btn-cancel { background: #f1f5f9; color: #475569; }
    </style>
</head>

<body style="background-color: #f8fafc;">

    <div class="edit-container">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 1.75rem; color: #0f172a;">Update Your Profile</h1>
            <p style="color: #64748b;">Keep your shipping information up to date</p>
        </div>

        <div class="edit-card">
            <form id="editProfileForm" onsubmit="handleUpdate(event)">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="editPhone" placeholder="Enter phone number" required>
                </div>

                <div class="form-group">
                    <label>Address Line</label>
                    <input type="text" id="editAddress" placeholder="Street, Building, etc." required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="editCity" placeholder="City" required>
                    </div>
                    <div class="form-group">
                        <label>State</label>
                        <input type="text" id="editState" placeholder="State" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" id="editPincode" placeholder="6-digit Pincode" required maxlength="6">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-cancel" onclick="history.back()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script>
        // Check Auth
        const user = checkAuth();
        if (!user) window.location.href = '../auth/login.html';

        // Pre-fill fields
        document.getElementById('editPhone').value = user.phone || '';
        document.getElementById('editAddress').value = user.addressLine || '';
        document.getElementById('editCity').value = user.city || '';
        document.getElementById('editState').value = user.state || '';
        document.getElementById('editPincode').value = user.pincode || '';

        async function handleUpdate(e) {
            e.preventDefault();
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = "Saving...";
            btn.disabled = true;

            const body = {
                phone: document.getElementById('editPhone').value,
                addressLine: document.getElementById('editAddress').value,
                city: document.getElementById('editCity').value,
                state: document.getElementById('editState').value,
                pincode: document.getElementById('editPincode').value
            };

            try {
                await apiCall('profile', 'PUT', body);
                
                // Update local storage user object
                Object.assign(user, body);
                localStorage.setItem('user', JSON.stringify(user));

                alert("Profile updated successfully! ✨");
                window.location.href = 'dashboard.html';
            } catch (err) {
                alert("Error: " + err.message);
                btn.innerText = "Save Changes";
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
