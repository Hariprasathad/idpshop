<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard | IDPShop</title>

    <link rel="icon" type="image/png" href="../../public/idp_browser_tab_logo.png">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
</head>

<body>
<div class="app-container">

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <img src="../../public/idp_shop_logo.png" alt="Logo" style="height: 40px;">
        </div>

        <div class="nav-center">
            <input type="text" class="search-input" placeholder="Search products...">
        </div>

        <div class="nav-right"></div>
    </nav>

    <div class="main-wrapper">

        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">

                <a onclick="switchTab('dashboard')" class="sidebar-link active" data-target="dashboard">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>

                <a onclick="switchTab('orders')" class="sidebar-link" data-target="orders">
                    <i class="fa-solid fa-box"></i>
                    <span>Orders</span>
                </a>

                <a onclick="switchTab('cart')" class="sidebar-link" data-target="cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Cart</span>
                </a>

            </nav>

            <div style="margin-top:auto;">
                <a href="../auth/login.html" class="sidebar-link" style="color:red;">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Content -->
        <main class="content-area">

            <!-- Dashboard -->
            <div id="tab-dashboard" class="tab-content active">
                <h1>Welcome User</h1>
                <p>This is your dashboard.</p>
            </div>

            <!-- Orders -->
            <div id="tab-orders" class="tab-content">
                <h1>Orders</h1>
                <p>No orders yet.</p>
            </div>

            <!-- Cart -->
            <div id="tab-cart" class="tab-content">
                <h1>Cart</h1>
                <p>Your cart is empty.</p>
            </div>

        </main>
    </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/user.js"></script>


</body>
</html>
