<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | IDPShop</title>

    <link rel="icon" type="image/png" href="../../public/idp_browser_tab_logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/auth.css">
</head>

<body>

    <div class="auth-card">

        <div class="auth-header">
            <img src="../../public/idp_shop_logo.png" alt="IDPShop Logo" style="width: 120px; margin-bottom: 1rem;">
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join us to start shopping</p>
        </div>

        <!-- Register Form -->
        <form id="registerForm">

            <div class="auth-input-group">
                <label class="auth-label">Full Name</label>
                <input type="text" id="name" class="auth-input" placeholder="John Doe" required>
            </div>

            <div class="auth-input-group">
                <label class="auth-label">Email Address</label>
                <input type="email" id="email" class="auth-input" placeholder="name@example.com" required>
            </div>

            <div class="auth-input-group">
                <label class="auth-label">Password</label>
                <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
            </div>

            <div class="auth-input-group">
                <label class="auth-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="auth-input" placeholder="••••••••" required>
            </div>

            <button type="submit" id="registerBtn" class="auth-submit-btn">Register</button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="/pages/auth/login.html" class="auth-link">Sign in</a>
        </p>

    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            await register(name, email, password, 'user');
        });
    </script>

</body>

</html>
